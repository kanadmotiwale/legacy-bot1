<!doctype html>
<html><head><meta charset="utf-8"><title>cua operator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#f6f6f4;color:#1d1d1b}
 header{background:#1d1d1b;color:#fff;padding:10px 16px;font-weight:600}
 main{padding:16px;max-width:1100px}
 table{border-collapse:collapse;width:100%;background:#fff}
 td,th{border-bottom:1px solid #e3e3df;padding:6px 8px;text-align:left;font-size:14px;vertical-align:top}
 .pill{display:inline-block;padding:1px 8px;border-radius:9px;font-size:12px;background:#e3e3df}
 .open{background:#ffe3a3}.human_in_control{background:#bfe0ff}.resolved{background:#cdeccd}.aborted,.expired{background:#f3c9c9}
 .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px} @media(max-width:800px){.grid{grid-template-columns:1fr}}
 .card{background:#fff;padding:12px;border:1px solid #e3e3df}
 button{padding:8px 14px;margin-right:6px;font-size:14px;cursor:pointer}
 img{max-width:100%;border:1px solid #ccc} code{font-size:12px} pre{white-space:pre-wrap;font-size:12px}
</style></head>
<body><header>cua operator console</header><main>{% block body %}{% endblock %}</main></body></html>
